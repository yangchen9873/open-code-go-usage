<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 用量监控</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <!-- 顶栏：页面标题、更新时间与手动刷新按钮 -->
      <header class="app-header">
        <div class="app-heading">
          <h1>LLM 用量概览</h1>
        </div>
        <span id="updated-at" class="updated-at"></span>
        <button id="refresh" class="refresh" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" />
          </svg>
        </button>
      </header>

      <section class="usage-card" aria-label="OpenCode Go Token 用量">
        <div class="card-heading">
          <div><h2>OpenCode Go</h2></div>
          <span id="status-opencode" class="status ok" role="status" aria-live="polite"></span>
        </div>
        <div id="usage-list-opencode" class="usage-list" aria-live="polite"></div>
        <div id="error-opencode" class="error" hidden><span id="error-message-opencode"></span><a href="https://opencode.ai/go" target="_blank" rel="noreferrer">打开用量页 ↗</a></div>
      </section>

      <section class="usage-card command-card" aria-label="Command Code GOAT 用量">
        <div class="card-heading">
          <div><h2>Command Code GOAT</h2></div>
          <span id="status-command" class="status ok" role="status" aria-live="polite"></span>
        </div>
        <div id="usage-list-command" class="usage-list" aria-live="polite"></div>
        <div id="error-command" class="error" hidden><span id="error-message-command"></span><a href="https://commandcode.ai/" target="_blank" rel="noreferrer">打开 Command Code ↗</a></div>
      </section>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
